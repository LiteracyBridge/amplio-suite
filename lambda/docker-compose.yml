version: '3.3'

services:
  db:
    image: postgres
    # restart: always
    environment:
      POSTGRES_PASSWORD: example

  lambda:
    container_name: lambda
    image: lambci/lambda:python3.8
    command: lambda_function.lambda_handler
    environment:
      DOCKER_LAMBDA_STAY_OPEN: 1
      DOCKER_LAMBDA_WATCH: 1
    volumes:
      - './:/var/task:ro,delegated'
    depends_on:
      - db
    ports:
      - '9001:9001'
