name: Publish site to Staging

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1

    - name: Use Node.js
      uses: actions/setup-node@v1
      with:
        node-version: '21'

    - name: Get yarn cache directory path
      id: yarn-cache-dir-path
      run: echo "::set-output name=dir::$(yarn cache dir)"

    - uses: actions/cache@v2
      id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
      with:
        path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: Build frontend
      run: |
        cd frontend
        yarn config set "strict-ssl" false -g
        yarn install
        yarn staging-build
        cd ..

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.STAGING__AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.STAGING__AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Deploy to s3
      run: |
        aws s3 rm s3://suite-test.amplio.org --recursive
        aws s3 cp --recursive dist/ s3://suite-test.amplio.org
