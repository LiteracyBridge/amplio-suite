version: '3.3'

services:
  web:
    build: .
    command: yarn serve
    working_dir: /usr/app
    volumes:
      - .:/usr/app
      - node_modules:/usr/app/node_modules
    ports:
      - '8080:8080'

  proxy:
    image: nginx
    restart: always
    volumes:
      - ./lambda/default.conf:/etc/nginx/conf.d/default.conf
      - ./lambda/api_proxy.conf:/etc/nginx/api_proxy.conf
    ports:
      - '9000:80'

  db:
    image: postgres
    environment:
      POSTGRES_USER: amplio
      POSTGRES_PASSWORD: fooFaBar
      POSTGRES_DB: ampliosuite
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'

  python-deps:
    build:
      context: ./lambda
    volumes:
      - './lambda:/usr/src/app'
      - package:/usr/src/app/package

  lambda-migration: &base
    image: lambci/lambda:python3.8
    command: migrations.lambda_handler
    environment:
      # Funtions with hot reload
      DOCKER_LAMBDA_STAY_OPEN: 1
      DOCKER_LAMBDA_WATCH: 1
    volumes:
      - './lambda:/var/task:ro,delegated'
      - package:/var/task/package
    depends_on:
      - db

  lambda-program_create:
    <<: *base
    command: program_create.lambda_handler

  lambda-program_retrieve:
    <<: *base
    command: program_retrieve.lambda_handler

  lambda-programs_index:
    <<: *base
    command: programs_index.lambda_handler

  lambda-project_retrieve:
    <<: *base
    command: project_retrieve.lambda_handler

  lambda-project_create:
    <<: *base
    command: project_create.lambda_handler

volumes:
  node_modules:
  postgres-data:
  package:
    driver: local
    driver_opts:
      type: none
      device: $PWD/lambda/package
      o: bind
