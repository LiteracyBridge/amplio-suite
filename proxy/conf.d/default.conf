map $original_request $lambda {
  'GET /programs HTTP/1.1' http://lambda-projects_get_by_user:9001/2015-03-31/functions/projects_get_by_user/invocations;

  'GET /program HTTP/1.1'  http://lambda-program_get:9001/2015-03-31/functions/program_get/invocations;
  'POST /program HTTP/1.1' http://lambda-program_create:9001/2015-03-31/functions/program_create/invocations;
  'PUT /program HTTP/1.1' http://lambda-program_update:9001/2015-03-31/functions/program_update/invocations;

  'DELETE /deployment HTTP/1.1' http://lambda-deployment_delete:9001/2015-03-31/functions/deployment_delete/invocations;
  'GET /deployment HTTP/1.1' http://lambda-deployments_get_multi:9001/2015-03-31/functions/deployments_get_multi/invocations;
  'PUT /deployment HTTP/1.1' http://lambda-deployments_update_multi:9001/2015-03-31/functions/deployments_update_multi/invocations;


  'POST /playlist HTTP/1.1' http://lambda-playlist_create:9001/2015-03-31/functions/playlist_create/invocations;
  'DELETE /playlist HTTP/1.1' http://lambda-playlist_delete:9001/2015-03-31/functions/playlist_delete/invocations;
  'GET /playlist HTTP/1.1'  http://lambda-playlists_get_multi:9001/2015-03-31/functions/playlists_get_multi/invocations;
  'PUT /playlist HTTP/1.1' http://lambda-playlists_update_multi:9001/2015-03-31/functions/playlists_update_multi/invocations;

  'POST /message HTTP/1.1' http://lambda-message_create:9001/2015-03-31/functions/message_create/invocations;
  'PUT /message HTTP/1.1' http://lambda-messages_update_multi:9001/2015-03-31/functions/messages_update_multi/invocations;
  'DELETE /message HTTP/1.1' http://lambda-message_delete:9001/2015-03-31/functions/message_delete/invocations;

  'GET /recipient HTTP/1.1' http://lambda-recipient_get:9001/2015-03-31/functions/recipient_get/invocations;
  'POST /recipient HTTP/1.1' http://lambda-recipient_create:9001/2015-03-31/functions/recipient_create/invocations;
  'PUT /recipient HTTP/1.1' http://lambda-recipient_update:9001/2015-03-31/functions/recipient_update/invocations;
  'DELETE /recipient HTTP/1.1' http://lambda-recipient_delete:9001/2015-03-31/functions/recipient_delete/invocations;
  'GET /recipients HTTP/1.1' http://lambda-recipients_retrieve_by_program:9001/2015-03-31/functions/recipients_retrieve_by_program/invocations;

  'GET /roadmap HTTP/1.1'  http://lambda-roadmap_get:9001/2015-03-31/functions/roadmap_get/invocations;
  'PUT /roadmap HTTP/1.1'  http://lambda-roadmap_update:9001/2015-03-31/functions/roadmap_update/invocations;

  'GET /languages HTTP/1.1' http://lambda-languages_index:9001/2015-03-31/functions/languages_index/invocations;
  'GET /categories HTTP/1.1' http://lambda-supported_categories_index:9001/2015-03-31/functions/supported_categories_index/invocations;
  'GET /sustainable-developments HTTP/1.1' http://lambda-sustainable_developments_index:9001/2015-03-31/functions/sustainable_developments_index/invocations;
  'GET /listening-models HTTP/1.1' http://lambda-listening_model_index:9001/2015-03-31/functions/listening_model_index/invocations;

}

server {
